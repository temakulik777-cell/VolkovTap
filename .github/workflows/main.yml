name: Build TIPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          brew install ldid xz
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          rsync -av --ignore-errors /tmp/sdks/ ~/theos/sdks/ || true

      - name: Setup iOS 15.6 SDK
        run: |
          set +e
          echo "=== Доступные SDK ==="
          ls ~/theos/sdks/ | grep iPhoneOS
          
          AVAILABLE_SDK=$(ls ~/theos/sdks | grep iPhoneOS15 | head -n 1)
          if [ -z "$AVAILABLE_SDK" ]; then
            AVAILABLE_SDK=$(ls ~/theos/sdks | grep iPhoneOS | head -n 1)
          fi
          echo "Реальный SDK: $AVAILABLE_SDK"
          
          if [ "$AVAILABLE_SDK" != "iPhoneOS15.6.sdk" ]; then
            ln -sf ~/theos/sdks/$AVAILABLE_SDK ~/theos/sdks/iPhoneOS15.6.sdk
          fi
          
          echo "=== Итоговые SDK ==="
          ls -la ~/theos/sdks/ | grep iPhone

      - name: Unzip Sources
        run: |
          set +e
          echo "=== Распаковка ZIP ==="
          find . -maxdepth 1 -name "*.zip" -print0 | while IFS= read -r -d '' f; do
            echo "Распаковываю: $f"
            unzip -o "$f" -d ./unpacked
          done
          echo ""
          echo "=== Поиск makefile ==="
          find . -iname "makefile" -not -path "./.theos/*"

      - name: Fix Paths and Structure
        run: |
          set +e
          MAKEFILE_PATH=$(find . -iname "makefile" -not -path "./.theos/*" 2>/dev/null | head -n 1)
          echo "Найден makefile: $MAKEFILE_PATH"
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ОШИБКА: makefile не найден!"
            exit 1
          fi

          # 1. Путь к Theos
          sed -i '' 's|export THEOS=/var/mobile/theos|export THEOS=~/theos|' "$MAKEFILE_PATH"

          # 2. Меняем целевую версию iOS на 15.6
          sed -i '' 's|TARGET := iphone:clang:16.5|TARGET := iphone:clang:15.6|' "$MAKEFILE_PATH"
          sed -i '' 's|TARGET := iphone:clang:16.6|TARGET := iphone:clang:15.6|' "$MAKEFILE_PATH"
          sed -i '' 's|TARGET := iphone:clang:17|TARGET := iphone:clang:15.6|' "$MAKEFILE_PATH"
          sed -i '' 's|TARGET := iphone:clang:15.8|TARGET := iphone:clang:15.6|' "$MAKEFILE_PATH"

          # 3. УБИРАЕМ -miphoneos-version-min, чтобы не конфликтовало с -target
          sed -i '' 's| -miphoneos-version-min=15.0||g' "$MAKEFILE_PATH"
          sed -i '' 's| -miphoneos-version-min=15.6||g' "$MAKEFILE_PATH"
          sed -i '' 's| -miphoneos-version-min=15.8||g' "$MAKEFILE_PATH"

          # 4. Добавляем флаги совместимости
          sed -i '' 's|-Wno-module-import-in-extern-c|-Wno-module-import-in-extern-c -Wno-vla-cxx-extension|' "$MAKEFILE_PATH"

          if ! grep -q "Wno-unguarded-availability" "$MAKEFILE_PATH"; then
            sed -i '' 's|_CFLAGS += -fobjc-arc|_CFLAGS += -fobjc-arc -Wno-unguarded-availability -Wno-unguarded-availability-new -Wno-deprecated-declarations|' "$MAKEFILE_PATH"
          fi

          echo "=== Makefile после правок ==="
          head -30 "$MAKEFILE_PATH" || true
          echo "---"
          grep -n "TARGET\|CFLAGS\|CXXFLAGS" "$MAKEFILE_PATH" | head -20 || true

          PROJECT_DIR=$(dirname "$MAKEFILE_PATH")
          cd "$PROJECT_DIR"
          echo "Корень проекта: $PROJECT_DIR"
          ls -la || true

          mkdir -p unity_api helpers drawing_view
          cp sources/*.h unity_api/ 2>/dev/null || true
          cp sources/*.h helpers/ 2>/dev/null || true
          cp sources/*.h drawing_view/ 2>/dev/null || true
          cp *.h unity_api/ 2>/dev/null || true
          cp *.h helpers/ 2>/dev/null || true
          cp *.h drawing_view/ 2>/dev/null || true

          echo "ГОТОВО"

      - name: Build TIPA
        run: |
          set +e
          MAKEFILE_PATH=$(find . -iname "makefile" -not -path "./.theos/*" 2>/dev/null | head -n 1)
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "Собираю в: $MAKEFILE_DIR"
          cd "$MAKEFILE_DIR"
          make package FINALPACKAGE=1 THEOS=~/theos

      - uses: actions/upload-artifact@v4
        with:
          name: VolkovTap-tipa
          path: |
            **/packages/*.tipa
            **/*.tipa
