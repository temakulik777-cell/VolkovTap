name: Build TIPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project *.xcodeproj -scheme * -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO
      - name: Package TIPA
        run: |
          mkdir Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r App.tipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VolkovTap
          path: App.tipa
