name: Build TIPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          brew install ldid xz
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          rsync -av --ignore-errors /tmp/sdks/ ~/theos/sdks/ || true

      - name: Fix SDK Path
        run: |
          set +e
          AVAILABLE_SDK=$(ls ~/theos/sdks | grep iPhoneOS | head -n 1)
          echo "Доступен SDK: $AVAILABLE_SDK"
          if [ "$AVAILABLE_SDK" != "iPhoneOS16.5.sdk" ]; then
            ln -s ~/theos/sdks/$AVAILABLE_SDK ~/theos/sdks/iPhoneOS16.5.sdk
          fi

      - name: Unzip Sources
        run: |
          set +e
          # Распаковываем все zip-архивы в текущую папку
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Распаковываю: $f"
              unzip -o "$f"
            fi
          done
          echo "=== Структура после распаковки ==="
          ls -la
          echo "=== Поиск Makefile ==="
          find . -name "Makefile" -not -path "./.theos/*"

      - name: Fix THEOS Path in Makefile
        run: |
          set +e
          # Ищем Makefile на любой глубине и правим путь
          MAKEFILE_PATH=$(find . -name "Makefile" -not -path "./.theos/*" | head -n 1)
          if [ -n "$MAKEFILE_PATH" ]; then
            echo "Правлю Makefile: $MAKEFILE_PATH"
            sed -i '' 's|export THEOS=/var/mobile/theos|export THEOS=~/theos|' "$MAKEFILE_PATH"
            head -5 "$MAKEFILE_PATH"
          fi

      - name: Build TIPA
        run: |
          set +e
          # Ищем папку с Makefile и собираем там
          MAKEFILE_DIR=$(dirname $(find . -name "Makefile" -not -path "./.theos/*" | head -n 1))
          cd "$MAKEFILE_DIR"
          make package FINALPACKAGE=1 THEOS=~/theos

      - uses: actions/upload-artifact@v4
        with:
          name: VolkovTap-tipa
          path: |
            **/packages/*.tipa
            **/*.tipa
